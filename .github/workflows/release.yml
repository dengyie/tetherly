name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: disable git autocrlf
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build release binaries
        run: cargo build --release --locked -p tetherly-node -p tetherly-cli
      - name: stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [ "${RUNNER_OS}" = "Windows" ]; then ext=".exe"; fi
          mkdir -p dist
          cp "target/release/tetherly${ext}" "dist/tetherly-${{ matrix.name }}${ext}"
          cp "target/release/tetherly-cli${ext}" "dist/tetherly-cli-${{ matrix.name }}${ext}"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: tetherly-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -l dist
          gh release create "${GITHUB_REF_NAME}" \
            --title "Tetherly ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
