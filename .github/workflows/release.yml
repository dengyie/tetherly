name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.4)'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  # Building on ubuntu-22.04 (glibc 2.35) leaves the artifact demanding
  # GLIBC_2.34, which will not load on the glibc 2.31 hosts the spec claims to
  # support. Build inside a Debian 11 (glibc 2.31) container instead: the
  # dynamic symbol floor then stays <= 2.31, so one binary runs on Debian 11 /
  # Ubuntu 20.04 and everything newer.
  build-linux:
    runs-on: ubuntu-latest
    container: debian:bullseye
    defaults:
      run:
        shell: bash
    steps:
      - name: point apt at the bullseye archive
        run: |
          set -euo pipefail
          # bullseye reached end of LTS, so deb.debian.org no longer serves its
          # pool (every update 404s). The frozen archive still does.
          printf '%s\n' \
            'deb http://archive.debian.org/debian bullseye main' \
            'deb http://archive.debian.org/debian-security bullseye-security main' \
            > /etc/apt/sources.list
          rm -rf /var/lib/apt/lists/*
      - name: install build dependencies
        run: |
          set -euo pipefail
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config binutils xz-utils
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build release binaries
        run: cargo build --release --locked -p tetherly-node -p tetherly-cli
      - name: refuse a linux binary newer than glibc 2.31
        run: |
          set -euo pipefail
          # bullseye is glibc 2.31, so any GLIBC_2.32+ symbol means the build
          # did not happen against the pinned container and must not ship.
          objdump -T target/release/tetherly | grep -Eo 'GLIBC_[0-9]+\.[0-9]+' | sort -u
          if objdump -T target/release/tetherly | grep -E 'GLIBC_2\.(3[2-9]|[4-9][0-9])' ; then
            echo "linux binary requires a glibc newer than 2.31" >&2
            exit 1
          fi
      - name: stage artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/tetherly dist/tetherly-linux-x86_64
          cp target/release/tetherly-cli dist/tetherly-cli-linux-x86_64
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: tetherly-linux-x86_64
          path: dist/*
          if-no-files-found: error

  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: disable git autocrlf
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build release binaries
        run: cargo build --release --locked -p tetherly-node -p tetherly-cli
      - name: stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [ "${RUNNER_OS}" = "Windows" ]; then ext=".exe"; fi
          mkdir -p dist
          cp "target/release/tetherly${ext}" "dist/tetherly-${{ matrix.name }}${ext}"
          cp "target/release/tetherly-cli${ext}" "dist/tetherly-cli-${{ matrix.name }}${ext}"
          # The AppKit viewer subprocess only exists on macOS (elsewhere the
          # bin is an honest stub); ship it where it can present.
          if [ "${RUNNER_OS}" = "macOS" ]; then
            cp "target/release/tetherly-viewer" "dist/tetherly-viewer-${{ matrix.name }}"
          fi
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: tetherly-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: build native .so (arm64-v8a)
        run: cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build -p tetherly-android --release
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: assemble debug
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: stage artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/tetherly-android-arm64-v8a.apk
          cp android/app/src/main/jniLibs/arm64-v8a/libtetherly_android.so dist/libtetherly_android-arm64-v8a.so
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: tetherly-android-arm64-v8a
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [build-linux, build-desktop, build-android]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${TAG_INPUT}" ]; then
            tag="${TAG_INPUT}"
          fi
          ls -l dist
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" --repo "${GITHUB_REPOSITORY}" --clobber dist/*
          else
            gh release create "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Tetherly ${tag}" \
              --generate-notes \
              dist/*
          fi
