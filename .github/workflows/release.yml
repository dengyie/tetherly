name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: disable git autocrlf
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build release binaries
        run: cargo build --release --locked -p tetherly-node -p tetherly-cli
      - name: refuse a linux binary newer than glibc 2.35
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # The binary is fully static except glibc/libgcc, so the runner's glibc is the floor.
          # ubuntu-22.04 provides glibc 2.35; ubuntu-latest (24.04) is glibc 2.39.
          # Any GLIBC_2.36+ in the binary will fail on glibc 2.31 hosts.
          if objdump -T target/release/tetherly | grep -E 'GLIBC_2\.(3[6-9]|[4-9][0-9])' ; then
            echo "linux binary requires a glibc newer than 2.35" >&2
            exit 1
          fi
      - name: stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [ "${RUNNER_OS}" = "Windows" ]; then ext=".exe"; fi
          mkdir -p dist
          cp "target/release/tetherly${ext}" "dist/tetherly-${{ matrix.name }}${ext}"
          cp "target/release/tetherly-cli${ext}" "dist/tetherly-cli-${{ matrix.name }}${ext}"
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: tetherly-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber dist/*
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Tetherly ${GITHUB_REF_NAME}" \
              --generate-notes \
              dist/*
          fi
