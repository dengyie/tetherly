name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.65)'
        required: true
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      version_code: ${{ steps.release.outputs.version_code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: resolve and checkout immutable release tag
        id: release
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${TAG_INPUT}"
          fi
          if ! [[ "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tag must match vX.Y.Z: ${tag}" >&2
            exit 1
          fi
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          git checkout --detach "refs/tags/${tag}"
          [ "$(git describe --tags --exact-match HEAD)" = "${tag}" ]

          version="${tag#v}"
          cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/{ s/.*"\([0-9][^"]*\)".*/\1/p; }' Cargo.toml | head -n 1)"
          client_version="$(sed -n 's/.*"version": "\([0-9][^"]*\)".*/\1/p' client/package.json | head -n 1)"
          tauri_version="$(sed -n 's/.*"version": "\([0-9][^"]*\)".*/\1/p' client/src-tauri/tauri.conf.json | head -n 1)"
          for actual in "${cargo_version}" "${client_version}" "${tauri_version}"; do
            [ "${actual}" = "${version}" ] || {
              echo "version mismatch for ${tag}: expected ${version}, got ${actual}" >&2
              exit 1
            }
          done
          pnpm --dir client install --frozen-lockfile
          (cd client && pnpm check && pnpm test && pnpm build)
          test -z "$(git status --porcelain -- client/dist)" || {
            echo 'committed client/dist is stale for release source' >&2
            exit 1
          }
          IFS=. read -r major minor patch <<< "${version}"
          [ "${major}" -le 2100 ] && [ "${minor}" -lt 1000 ] && [ "${patch}" -lt 1000 ]
          version_code=$((major * 1000000 + minor * 1000 + patch))
          [ "${version_code}" -gt 0 ] && [ "${version_code}" -le 2100000000 ]
          {
            printf 'tag=%s\n' "${tag}"
            printf 'version=%s\n' "${version}"
            printf 'version_code=%s\n' "${version_code}"
          } >> "${GITHUB_OUTPUT}"

  frontend:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: build frontend from release source
        working-directory: client
        run: pnpm install --frozen-lockfile && pnpm build:ci
      - uses: actions/upload-artifact@v7
        with:
          name: tetherly-frontend-dist
          path: client/dist
          if-no-files-found: error

  # Building on ubuntu-22.04 (glibc 2.35) leaves the artifact demanding
  # GLIBC_2.34, which will not load on the glibc 2.31 hosts the spec claims to
  # support. Build inside a Debian 11 (glibc 2.31) container instead: the
  # dynamic symbol floor then stays <= 2.31, so one binary runs on Debian 11 /
  # Ubuntu 20.04 and everything newer.
  build-linux:
    needs: [prepare, frontend]
    runs-on: ubuntu-latest
    container: debian:bullseye
    defaults:
      run:
        shell: bash
    steps:
      - name: point apt at the bullseye archive
        run: |
          set -euo pipefail
          # bullseye reached end of LTS, so deb.debian.org no longer serves its
          # pool (every update 404s). The frozen archive still does.
          printf '%s\n' \
            'deb http://archive.debian.org/debian bullseye main' \
            'deb http://archive.debian.org/debian-security bullseye-security main' \
            > /etc/apt/sources.list
          rm -rf /var/lib/apt/lists/*
      - name: install build dependencies
        run: |
          set -euo pipefail
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config binutils xz-utils
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build release binaries
        run: cargo build --release --locked -p tetherly-node -p tetherly-cli
      - name: refuse a linux binary newer than glibc 2.31
        run: |
          set -euo pipefail
          # bullseye is glibc 2.31, so any GLIBC_2.32+ symbol means the build
          # did not happen against the pinned container and must not ship.
          objdump -T target/release/tetherly | grep -Eo 'GLIBC_[0-9]+\.[0-9]+' | sort -u
          if objdump -T target/release/tetherly | grep -E 'GLIBC_2\.(3[2-9]|[4-9][0-9])' ; then
            echo "linux binary requires a glibc newer than 2.31" >&2
            exit 1
          fi
      - name: stage artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/tetherly dist/tetherly-linux-x86_64
          cp target/release/tetherly-cli dist/tetherly-cli-linux-x86_64
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: tetherly-linux-x86_64
          path: dist/*
          if-no-files-found: error

  build-desktop:
    needs: [prepare, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: disable git autocrlf
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build release binaries
        run: cargo build --release --locked -p tetherly-node -p tetherly-cli
      - name: stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [ "${RUNNER_OS}" = "Windows" ]; then ext=".exe"; fi
          mkdir -p dist
          cp "target/release/tetherly${ext}" "dist/tetherly-${{ matrix.name }}${ext}"
          cp "target/release/tetherly-cli${ext}" "dist/tetherly-cli-${{ matrix.name }}${ext}"
          # The AppKit viewer subprocess only exists on macOS (elsewhere the
          # bin is an honest stub); ship it where it can present.
          if [ "${RUNNER_OS}" = "macOS" ]; then
            cp "target/release/tetherly-viewer" "dist/tetherly-viewer-${{ matrix.name }}"
          fi
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: tetherly-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # Installer bundles for the Tauri 2 shell (M3 §6.3): .dmg on macOS,
  # .msi on Windows. The SPA dist is committed (the daemon embeds it via
  # include_str!), so no Node step is needed — the bundler reads
  # client/src-tauri/tauri.conf.json with frontendDist ../dist as-is.
  bundle-desktop:
    needs: [prepare, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: disable git autocrlf
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: tetherly-frontend-dist
          path: client/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - name: install tauri-cli
        run: cargo install tauri-cli --locked --version "^2"
      - name: build bundle (.dmg on macOS, .msi on Windows)
        working-directory: client/src-tauri
        run: cargo tauri build ${{ matrix.args }} --ci
      - name: stage bundle artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find target -path '*/bundle/*' \( -name '*.dmg' -o -name '*.msi' \) -exec cp {} dist/ \;
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: tetherly-shell-bundle-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  build-android:
    needs: [prepare, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: import release signing key
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_RELEASE_KEYSTORE_B64}"
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_B64}" | base64 --decode > "${RUNNER_TEMP}/tetherly-release.jks"
          test -s "${RUNNER_TEMP}/tetherly-release.jks"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: build native .so (arm64-v8a)
        run: cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build -p tetherly-android --release
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: assemble signed release
        working-directory: android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${RELEASE_STORE_PASSWORD}"
          test -n "${RELEASE_KEY_ALIAS}"
          test -n "${RELEASE_KEY_PASSWORD}"
          gradle :app:assembleRelease --no-daemon --stacktrace \
            -PtetherlyVersion='${{ needs.prepare.outputs.version }}' \
            -PtetherlyVersionCode='${{ needs.prepare.outputs.version_code }}' \
            -PreleaseKeystore="${RUNNER_TEMP}/tetherly-release.jks" \
            -PreleaseStorePassword="${RELEASE_STORE_PASSWORD}" \
            -PreleaseKeyAlias="${RELEASE_KEY_ALIAS}" \
            -PreleaseKeyPassword="${RELEASE_KEY_PASSWORD}"
      - name: inspect release APK identity and signature
        working-directory: android
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "${SDK}" && test -d "${SDK}"
          APKANALYZER="$SDK/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$APKANALYZER" || APKANALYZER="$(ls "$SDK"/cmdline-tools/*/bin/apkanalyzer | sort -V | tail -1)"
          APKSIGNER="$(ls "$SDK"/build-tools/*/apksigner | sort -V | tail -1)"
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "${apk}"
          test "$("$APKANALYZER" manifest version-name "${apk}")" = "${EXPECTED_VERSION}"
          test "$("$APKANALYZER" manifest version-code "${apk}")" = "${EXPECTED_VERSION_CODE}"
          "$APKANALYZER" manifest application-id "${apk}" | grep -Fx 'app.tetherly'
          "$APKANALYZER" manifest version-name "${apk}" | grep -Fx "${EXPECTED_VERSION}"
          "$APKANALYZER" manifest version-code "${apk}" | grep -Fx "${EXPECTED_VERSION_CODE}"
          "$APKSIGNER" verify --verbose "${apk}"
          if "$APKSIGNER" verify --print-certs "${apk}" | grep -qi 'CN=Android Debug'; then
            echo 'debug signing certificate is not allowed' >&2
            exit 1
          fi
      - name: stage artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/tetherly-android-arm64-v8a.apk
          cp android/app/src/main/jniLibs/arm64-v8a/libtetherly_android.so dist/libtetherly_android-arm64-v8a.so
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: tetherly-android-arm64-v8a
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [prepare, frontend, build-linux, build-desktop, bundle-desktop, build-android]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: create digest manifest
        run: |
          set -euo pipefail
          test -d dist
          (
            cd dist
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
            test -s SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - uses: actions/upload-artifact@v7
        with:
          name: tetherly-release-digests
          path: dist/SHA256SUMS
          if-no-files-found: error
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          version="${RELEASE_VERSION}"
          [ "${tag#v}" = "${version}" ]
          test -s dist/SHA256SUMS
          ls -l dist
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${tag} already exists; immutable publish refuses replacement" >&2
            exit 1
          fi
          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Tetherly ${tag}" \
            --generate-notes \
            dist/*
