name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Building on ubuntu-22.04 (glibc 2.35) leaves the artifact demanding
  # GLIBC_2.34, which will not load on the glibc 2.31 hosts the spec claims to
  # support. Build inside a Debian 11 (glibc 2.31) container instead: the
  # dynamic symbol floor then stays <= 2.31, so one binary runs on Debian 11 /
  # Ubuntu 20.04 and everything newer.
  build-linux:
    runs-on: ubuntu-latest
    container: debian:bullseye
    steps:
      - name: install build dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config binutils xz-utils
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build release binaries
        run: cargo build --release --locked -p tetherly-node -p tetherly-cli
      - name: refuse a linux binary newer than glibc 2.31
        run: |
          set -euo pipefail
          # bullseye is glibc 2.31, so any GLIBC_2.32+ symbol means the build
          # did not happen against the pinned container and must not ship.
          objdump -T target/release/tetherly | grep -Eo 'GLIBC_[0-9]+\.[0-9]+' | sort -u
          if objdump -T target/release/tetherly | grep -E 'GLIBC_2\.(3[2-9]|[4-9][0-9])' ; then
            echo "linux binary requires a glibc newer than 2.31" >&2
            exit 1
          fi
      - name: stage artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/tetherly dist/tetherly-linux-x86_64
          cp target/release/tetherly-cli dist/tetherly-cli-linux-x86_64
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: tetherly-linux-x86_64
          path: dist/*
          if-no-files-found: error

  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: disable git autocrlf
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build release binaries
        run: cargo build --release --locked -p tetherly-node -p tetherly-cli
      - name: stage artifacts
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [ "${RUNNER_OS}" = "Windows" ]; then ext=".exe"; fi
          mkdir -p dist
          cp "target/release/tetherly${ext}" "dist/tetherly-${{ matrix.name }}${ext}"
          cp "target/release/tetherly-cli${ext}" "dist/tetherly-cli-${{ matrix.name }}${ext}"
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: tetherly-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [build-linux, build-desktop]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber dist/*
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Tetherly ${GITHUB_REF_NAME}" \
              --generate-notes \
              dist/*
          fi
