[graph]
all-features = true
exclude-dev = false

[advisories]
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0370/0371/0372: zvariant/zbus_names/zvariant_derive merged into zbus 6.0.
    # Transitive dependencies through secret-service v4.0.0; no security vulnerability.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    "CC0-1.0",
    "NCSA",
    "OpenSSL",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "easytier" },
    { crate = "easytier-core" },
    { crate = "easytier-ffi" },
    { crate = "hbb_common" },
    { crate = "rustdesk" },
    { crate = "rustdesk-server" },
    { crate = "scrap" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
