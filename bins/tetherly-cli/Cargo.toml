[package]
name = "tetherly-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Phase 0 pairing and ping CLI"
publish = false

[[bin]]
name = "tetherly-cli"
path = "src/main.rs"

[dependencies]
tetherly-core.workspace = true
tetherly-crypto.workspace = true
tetherly-net.workspace = true
tetherly-loopback.workspace = true
# §218: worker-thread QoS lift for the long-running watcher runtime
# (lift_current_thread_user_initiated lives in platform).
tetherly-node.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true

# SIGPIPE default disposition in main() (already in the lockfile via the
# workspace graph; no new package).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
