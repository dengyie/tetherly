[package]
name = "tetherly-net"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "TCP Hello/SPAKE2/Noise sessions and optional LAN mDNS"
publish = false

[features]
default = ["lan"]
lan = ["mdns-sd"]

[dependencies]
tetherly-core.workspace = true
tetherly-crypto.workspace = true
mdns-sd = { workspace = true, optional = true }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zeroize.workspace = true
serde.workspace = true

[dev-dependencies]
proptest.workspace = true
# Backpressure tests pin SO_SNDBUF/SO_RCVBUF below one frame; the std
# socket buffer setters are gone in the current toolchain, so the pin
# goes through socket2 (already in the tree via mio/tokio).
socket2 = { version = "0.6", default-features = false }
