[package]
name = "tetherly-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Phase 1 LAN node: persist, notify/clip/file hubs, local UI API"
publish = false

[lib]
name = "tetherly_node"
path = "src/lib.rs"

[[bin]]
name = "tetherly"
path = "src/bin/tetherly.rs"

[dependencies]
tetherly-core.workspace = true
tetherly-crypto.workspace = true
tetherly-net.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
if-addrs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
getrandom.workspace = true
arboard.workspace = true
png = "0.18"
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    # ANCS over BLE (src/ancs/win_gatt.rs): the WinRT Bluetooth stack, the
    # `IVectorView` the service/characteristic queries return, and the
    # `IBuffer`/`DataReader`/`DataWriter` used to move GATT values in and out.
    # All are feature flags on the already-present `windows` crate, so no new
    # package enters the lockfile.
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Keychain generic-password storage for the identity secret (src/cred/macos.rs).
security-framework = "3"
security-framework-sys = "2"
# CoreGraphics capture for src/screen/macos.rs. `default-features = false`
# keeps the objc2-metal/dispatch2 surface out; `arboard` already pulls these
# same crates, so no new package enters the lockfile.
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSUUID",
    "NSString",
    "NSArray",
    "NSData",
    "NSError",
    "NSRunLoop",
    "NSDate",
    "NSObject",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFCGTypes",
    "CFRunLoop",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGDirectDisplay",
    "CGImage",
] }
# CoreBluetooth GATT client for ANCS (src/ancs/macos.rs).
dispatch2 = { version = "0.3", default-features = false, features = ["alloc", "objc2"] }
objc2-core-bluetooth = { version = "0.3", default-features = false, features = [
    "std",
    "CBCentralManager",
    "CBPeripheral",
    "CBService",
    "CBCharacteristic",
    "CBUUID",
    "CBManager",
    "CBPeer",
    "CBAttribute",
    "CBError",
    "bitflags",
    "dispatch2",
] }

[target.'cfg(unix)'.dependencies]
# D-Bus client for BlueZ GATT ANCS (src/ancs/bluez.rs). Reuses zbus 4.4.0 already in Cargo.lock.
zbus = { version = "4", default-features = false, features = ["tokio"] }
libc = "0.2"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Secret Service (libsecret) storage over the session bus (src/cred/linux.rs).
# `rt-tokio-crypto-rust` uses the pure-Rust crypto backend (no openssl).
secret-service = { version = "4", default-features = false, features = ["rt-tokio-crypto-rust"] }
# X11 capture/present for src/screen/x11.rs. `shm` enables MIT-SHM; without it
# every frame would cross the socket via plain `GetImage`.
x11rb = { version = "0.13", features = ["shm"] }
