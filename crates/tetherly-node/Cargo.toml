[package]
name = "tetherly-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Phase 1 LAN node: persist, notify/clip/file hubs, local UI API"
publish = false

[lib]
name = "tetherly_node"
path = "src/lib.rs"

[[bin]]
name = "tetherly"
path = "src/bin/tetherly.rs"

[dependencies]
tetherly-core.workspace = true
tetherly-crypto.workspace = true
tetherly-net.workspace = true
anyhow.workspace = true
clap.workspace = true
if-addrs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
getrandom.workspace = true
arboard.workspace = true
png = "0.18"
zstd = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Keychain generic-password storage for the identity secret (src/cred/macos.rs).
security-framework = "3"
security-framework-sys = "2"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Secret Service (libsecret) storage over the session bus (src/cred/linux.rs).
# `rt-tokio-crypto-rust` uses the pure-Rust crypto backend (no openssl).
secret-service = { version = "4", default-features = false, features = ["rt-tokio-crypto-rust"] }
